name: coin_nest
description: "CoinNest - Ứng dụng quản lý chi tiêu cá nhân"
publish_to: "none"
version: 1.0.0+1

environment:
    sdk: ^3.10.8

dependencies:
    flutter:
        sdk: flutter
    flutter_map: ^8.1.1
    latlong2: ^0.9.1
    sqflite: ^2.4.2
    path_provider: ^2.1.5
    path: ^1.9.1
    provider: ^6.1.5
    http: ^1.2.2
    fl_chart: ^0.70.2
    intl: ^0.19.0
    google_fonts: ^6.2.1
    camera: ^0.12.0+1
    image_picker: ^1.2.2
    permission_handler: ^12.0.2
    google_mlkit_text_recognition: ^0.15.1
    shared_preferences: ^2.3.4
    flutter_secure_storage: ^9.2.4
    flutter_svg: ^2.2.3
    crypto: ^3.0.6
    uuid: ^4.5.1
    flutter_notification_listener: ^1.3.4

    # Firebase
    firebase_core: ^4.7.0
    firebase_auth: ^6.4.0
    cloud_firestore: ^6.3.0
    google_sign_in: ^7.2.0
    cloud_functions: ^6.2.0
    firebase_storage: ^13.3.0
    flutter_local_notifications: ^21.0.0
    timezone: ^0.11.0
    flutter_timezone: ^5.1.0
    # SQLite realtime viewer
    saropa_drift_advisor: ^3.5.1

dev_dependencies:
    flutter_test:
        sdk: flutter
    integration_test:
        sdk: flutter
    sqflite_common_ffi: ^2.3.6
    flutter_lints: ^6.0.0

flutter:
    uses-material-design: true
    assets:
        - assets/image/
